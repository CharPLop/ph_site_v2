# Pubblica il sito su GitHub Pages a ogni push su main (o a mano da
# Actions → Pubblica → Run workflow).
#  • Prima del lancio: anteprima su https://charplop.github.io/ph_site_v2/
#    (npm run build:anteprima, sempre in noindex).
#  • Dal lancio, con la variabile di repository DOMINIO_ATTIVO = "si"
#    (Settings → Secrets and variables → Actions → Variables): sito per
#    www.psicheholos.it (npm run build). Vedi docs/LANCIO.md.
# La build include il guard dei segnaposto: se trova un bloccante, non pubblica.
name: Pubblica

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dipendenze
        run: npm ci

      - name: Build (dominio o anteprima)
        run: |
          if [ "${{ vars.DOMINIO_ATTIVO }}" = "si" ]; then
            npm run build
          else
            npm run build:anteprima
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
